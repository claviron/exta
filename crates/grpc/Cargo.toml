[package]
name = "claviron-grpc"
version = "0.2.0-alpha.24"
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Typed mTLS-secured administration services for Claviron"
documentation = "https://docs.rs/claviron-grpc"
keywords = ["grpc", "mtls", "claviron"]
categories = ["network-programming", "asynchronous"]
edition = "2024"
autotests = false
include = ["src/**", "proto/*.proto", "build.rs", "Cargo.toml", "README.md", "LICENSE-*"]

# ─────────────────────────────────────────────────────────────────────
# Features
# ─────────────────────────────────────────────────────────────────────
# `server` pulls in Edge ingress, config parsing,
# DB ORM, certificate handling, and all sibling claviron-* crates the
# gRPC services need.
#
# Default feature set is empty so a downstream consumer must opt in;
# avoids accidentally compiling the heavy server tree into consumers that
# only need generated proto types.
[features]
default = []
server = [
    "tonic/router",
    # Claviron core facade. Extra crates must not depend on
    # claviron's hidden internal crates directly.
    "dep:claviron",
    "claviron/edge",
    "claviron/tls",
    "claviron/hosting",
    "claviron/auth",
    "claviron-acme?/server",
    # HTTP adapter
    "dep:http",
    "dep:http-body-util",
    "dep:futures-util",
    "dep:tower",
    "dep:thiserror",
    "dep:tokio",
    "dep:async-trait",
    "dep:serde",
    "dep:tracing",
    # reflection / cert handling
    "dep:tonic-reflection",
    "dep:time",
]
tasks = ["claviron/tasks"]
users = ["server", "claviron/users", "dep:serde_json"]
authorization = ["server", "claviron/authorization", "dep:serde_json"]
registration = ["mtls-manager", "dep:base64ct", "dep:serde_json"]
workers = ["server"]
metrics = ["server", "claviron/metrics"]
dns = ["server", "dep:claviron-dns"]
domains = ["server", "dep:claviron-domains"]
certificate-manager = ["server", "claviron/tls"]
mtls-manager = ["server", "claviron/tls"]
mtls = ["mtls-manager"]
certificates = ["certificate-manager"]

acme = [
    "dep:claviron-acme",
    "claviron-acme/db",
]

# ─────────────────────────────────────────────────────────────────────
# Dependencies
# ─────────────────────────────────────────────────────────────────────
# Layout:
#   - Proto/codegen dependencies are always compiled so server modules can use
#     generated message and service types.
#   - Server-only dependencies are gated by `server`.

[dependencies]
# ── Proto / shared server dependencies ───────────────────────────────
claviron = { workspace = true, optional = true }
# ── Server-only (gated by `server` feature) ──────────────────────────
claviron-acme = { version = "0.2.0-alpha.24", path = "../acme", optional = true }
claviron-dns = { version = "0.2.0-alpha.24", path = "../dns", default-features = false, features = ["service"], optional = true }
claviron-domains = { version = "0.2.0-alpha.24", path = "../domains", default-features = false, features = ["godaddy", "namecheap"], optional = true }

tokio = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }

tonic = { workspace = true, default-features = false, features = ["codegen", "transport"] }
tonic-prost.workspace = true
prost.workspace = true
prost-types.workspace = true


serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
base64ct = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

# HTTP adapter
http = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
tower = { workspace = true, optional = true }

# reflection / cert handling
tonic-reflection = { workspace = true, optional = true }
time = { workspace = true, optional = true }

[build-dependencies]
tonic-prost-build.workspace = true

[dev-dependencies]
claviron = { workspace = true, features = ["sqlite"] }
serde_yaml.workspace = true
sqlx = { workspace = true, features = ["sqlite"] }
